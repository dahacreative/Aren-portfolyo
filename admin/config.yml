backend:
  name: git-gateway
  branch: main

# Cloudinary hesabına bağlı: cloud_name ve api_key'i kendi Cloudinary
# panelindeki (Dashboard, sol üst) bilgilerinle değiştir. Bunlar gizli
# bilgi değildir, herkese açık config.yml içinde durmaları güvenlidir.
# NOT: Yeni bir "unsigned" preset açmana gerek yok — Cloudinary hesabında
# zaten hazır duran "ml_default" (Media Library) preset'i bu widget için
# otomatik kullanılır, Signed olması normaldir.
media_library:
  name: cloudinary
  config:
    cloud_name: liktnikz
    api_key: 554196976855164

locale: "en"
site_url: https://arenselvi.netlify.app/

collections:
  - name: "settings"
    label: "Ayarlar (Menü & Renkler)"
    files:
      - name: "settings"
        label: "Genel Ayarlar"
        file: "content/settings.json"
        fields:
          - { label: "Site Başlığı", name: "siteTitle", widget: "string" }
          - label: "Menü Öğeleri"
            name: "nav"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "ID (değiştirme, linkler buna bağlı)", name: "id", widget: "string" }
              - { label: "Görünen Etiket", name: "label", widget: "string" }
              - label: "Tür"
                name: "type"
                widget: "select"
                options: ["about", "category", "contact"]
              - { label: "Renk", name: "color", widget: "color" }

  - name: "about"
    label: "aren selvioğlu (Hakkında)"
    files:
      - name: "about"
        label: "Hakkında Sayfası"
        file: "content/about.json"
        fields:
          - { label: "İsim", name: "name", widget: "string" }
          - { label: "Ünvan", name: "title", widget: "string" }
          - { label: "Şirket", name: "company", widget: "string" }
          - { label: "E-posta", name: "email", widget: "string" }
          - { label: "Panel Rengi", name: "color", widget: "color" }
          - { label: "Fotoğraf", name: "photo", widget: "image", required: false }
          - { label: "Biyografi", name: "bio", widget: "text" }

  - name: "contact"
    label: "İletişim"
    files:
      - name: "contact"
        label: "İletişim Sayfası"
        file: "content/contact.json"
        fields:
          - { label: "Panel Rengi", name: "color", widget: "color" }
          - { label: "E-posta", name: "email", widget: "string" }
          - { label: "Telefon", name: "phone", widget: "string", required: false }
          - { label: "Adres", name: "address", widget: "string", required: false }
          - label: "Sosyal Medya Linkleri"
            name: "social"
            widget: "list"
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: "Etiket", name: "label", widget: "string" }
              - { label: "Link (URL)", name: "url", widget: "string" }

  - name: "categories"
    label: "Kategoriler & Markalar"
    files:
      - name: "logo-design"
        label: "Logo Design"
        file: "content/categories/logo-design.json"
        fields: &categoryFields
          - { label: "Sayfa Başlığı", name: "title", widget: "string" }
          - { label: "Panel Rengi", name: "color", widget: "color" }
          - label: "Markalar / İşler"
            name: "brands"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "ID (benzersiz, boşluksuz, örn: marka-adi)", name: "id", widget: "string" }
              - { label: "Marka / İş Adı", name: "name", widget: "string" }
              - { label: "Alt Başlık", name: "subtitle", widget: "string", required: false }
              - label: "Açıklama Metni (opsiyonel, kısa tanıtım)"
                name: "description"
                widget: "text"
                required: false
              - { label: "Logo / Kapak Görseli (grid'de görünen)", name: "logo", widget: "image" }
              - label: "Video Linkleri (opsiyonel, istediğin kadar ekle/çıkar)"
                name: "videos"
                widget: "list"
                required: false
                hint: "Videoyu Cloudinary'ye (ya da YouTube/Vimeo'ya) elle yükle, her video için buraya bir link ekle. Görseller gibi 'Add' ile ekler, çöp kutusuyla silersin. Popup'ta videolar galeri görsellerinden önce, eklediğin sırayla oynar."
                field: { label: "Video Linki", name: "video", widget: "string" }
              - label: "Popup Galeri Görselleri (sırayla gösterilir, ok tuşlarıyla gezilir)"
                name: "images"
                widget: "list"
                required: false
                hint: "Aşağıdaki 'Tıklanabilir Liste' doldurulursa bu galeri yerine o liste kullanılır."
                field: { label: "Görsel", name: "image", widget: "image" }
              - label: "Tıklanabilir Liste (ör. Awards için: her satır bir kazanım, tıklanınca sağda o işin görseli/videosu açılır)"
                name: "entries"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                hint: "Bu doldurulursa yukarıdaki galeri yerine bu liste kullanılır. Her satır için metni gir, sonra görsel veya video linkinden birini (istersen ikisini de) doldur — video girilmişse video oynar."
                fields:
                  - { label: "Liste Metni (ör. '2019 — Gold, Getir Campaign')", name: "label", widget: "string" }
                  - { label: "Görsel (video kullanmıyorsan doldur)", name: "image", widget: "image", required: false }
                  - label: "Video Linki (opsiyonel, girilirse görsel yerine bu oynar)"
                    name: "video"
                    widget: "string"
                    required: false
                    hint: "Videoyu Cloudinary'ye (ya da YouTube/Vimeo'ya) elle yükle, buraya linkini yapıştır."
      - name: "advertising-design"
        label: "Advertising Design"
        file: "content/categories/advertising-design.json"
        fields: *categoryFields
      - name: "motion-graphics"
        label: "Motion Graphics"
        file: "content/categories/motion-graphics.json"
        fields: *categoryFields
      - name: "personal-works"
        label: "Personal Works"
        file: "content/categories/personal-works.json"
        fields: *categoryFields
      - name: "awards"
        label: "Awards"
        file: "content/categories/awards.json"
        fields: *categoryFields
